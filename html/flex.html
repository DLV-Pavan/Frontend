<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: auto auto auto;
            background-color: blue;
            column-gap: 30px;
        }
        .container div{
            background-color: white;
            margin: 10px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="itm1">Item 1</div>
        <div id="itm2">Item 2</div>
        <div id="itm3">Item 3</div>
        <div id="itm4">Item 4</div>
        <div>Item 5</div>
        <div>Item 6</div>

    </div>
</body>
</html>
