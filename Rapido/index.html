<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rapido</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
   <header class="border-bottom sticky-top bg-body-tertiary">
    <div class="container">
        <nav class="navbar navbar-expand-lg py-3">
            
            <!-- Guaranteed Rapido Brand Logo (Embedded Inline SVG) -->
            <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="./assets/NewLogo (1).png">
            </a>

            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNavAltMarkup"
              aria-controls="navbarNavAltMarkup"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
              <div class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
                <a class="nav-link active fw-semibold" aria-current="page" href="#">Home</a>
                <a class="nav-link fw-semibold" href="#">About Us</a>
                <a class="nav-link fw-semibold" href="#">Safety</a>
                <a class="nav-link fw-semibold" href="#">Careers</a>
                <a class="nav-link fw-semibold" href="#">Blog</a>
                <a class="nav-link fw-semibold" href="#">Press</a>
                <a class="nav-link fw-semibold" href="#">Contact Us</a>
                <a
                  class="btn btn-warning fw-bold px-4 py-2 rounded-pill mt-2 mt-lg-0"
                  href="#"
                  >Download App</a
                >
              </div>
            </div>
          </div>
        </nav>
      </div>
    </header>

    <!-- Hero Section -->
    <section class="py-5">
      <div class="container">
        <div class="row align-items-center">
          <!-- Left Column: Text & Booking Form -->
          <div class="col-lg-6 pe-lg-5">
            <h1 class="hero-title mb-2">
              India’s #1<br>Ride-hailing App
            </h1>
            <p class="hero-subtitle">
              Quick, Affordable rides at your doorstep
            </p>

            <form onsubmit="event.preventDefault();">
              <!-- Pickup Location Input -->
              <div class="custom-input-group d-flex align-items-center mb-3">
                <i class="bi bi-geo-alt-fill text-dark me-3 fs-5"></i>
                <input type="text" class="form-control p-0" placeholder="Enter Pickup Location" required>
              </div>

              <!-- Drop Location Input -->
              <div class="custom-input-group d-flex align-items-center mb-4">
                <i class="bi bi-record-circle-fill text-dark me-3 fs-5"></i>
                <input type="text" class="form-control p-0" placeholder="Enter Drop Location" required>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn btn-book-ride w-100">
                Book Ride
              </button>
            </form>
          </div>

          <!-- Right Column: Vehicles Banner Image -->
          <div class="col-lg-6 text-center">
            <img
              src="https://content-cus.rapido.bike/image/banner_image_new.png"
              alt="Rapido Vehicles"
              class="img-fluid rounded-4 shadow-sm"
              onerror="this.src='https://placehold.co/600x400/e2e8f0/1e293b?text=Rapido+Vehicles'"
            />
          </div>
        </div>
      </div>
    </section>


    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
